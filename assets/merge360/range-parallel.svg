<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="964.8pt" height="340pt" viewBox="0 0 964.8 340" version="1.1" role="img" aria-labelledby="range-title range-description">
 <title id="range-title">Range-parallel weight merge</title>
 <desc id="range-description">The ordered tensor list is cut into N contiguous ranges of roughly equal bytes. Each range worker streams the base and expert tensors for its range, applies the merge rule, and writes part files and a RANGE_DONE marker under the output's .tmp directory. Once every range is done, finalize renumbers the parts, writes the index, copies config and tokenizer files from the base, records merge_info.json, and atomically renames the directory to the output path.</desc>
 <defs>
  <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
   <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
  </marker>
  <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
   <path d="M0,0 L10,5 L0,10 z" fill="#F44900"/>
  </marker>
  <style type="text/css">
   text { font-family: 'DejaVu Sans', Arial, Helvetica, sans-serif; fill: #111111; }
   .title { font-size: 22px; font-weight: 700; }
   .h { font-size: 20px; font-weight: 700; text-anchor: middle; }
   .sub { font-size: 14px; text-anchor: middle; }
   .meta { font-size: 10.8px; text-anchor: middle; fill: #2A5160; }
   .step { font-size: 12.5px; }
   .lbl { font-size: 13px; }
   .mid { text-anchor: middle; }
   .file { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 10.5px; }
   .slice { font-size: 12px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
   .foot { font-size: 11.5px; fill: #2A5160; }
   .ink { fill: none; stroke: #111111; stroke-width: 2.2; }
   .orch  { fill: #F2F6F3; stroke: #2A5160; stroke-width: 2.6; }
   .agent { fill: #F8EFE8; stroke: #E1BFA5; stroke-width: 3; }
   .infer { fill: #E6F2E9; stroke: #111111; stroke-width: 2.2; }
   .train { fill: #FFF6F1; stroke: #F44900; stroke-width: 2.6; }
  </style>
 </defs>

 <rect x="0" y="0" width="964.8" height="340" fill="#ffffff"/>

 <!-- Header -->
 <text class="title" x="36" y="31">Range-parallel merge</text>
 <text x="928.8" y="29" style="font-size:12.5px; text-anchor:end; fill:#2A5160">python -m merge360 &lt;method&gt; --num-splits N --split-id i, then finalize</text>

 <!-- Ordered tensor list, cut into byte-balanced ranges -->
 <rect class="orch" x="36" y="64" width="200" height="244"/>
 <text class="h" x="136" y="93">Tensor list</text>
 <text class="sub" x="136" y="115" style="font-size:12.5px">sorted by shard, then name</text>
 <rect x="56" y="130" width="160" height="35" fill="#2A5160"/>
 <rect x="56" y="167" width="160" height="35" fill="#2A5160"/>
 <rect x="56" y="204" width="160" height="35" fill="#9DB3BC"/>
 <rect x="56" y="241" width="160" height="35" fill="#2A5160"/>
 <text class="slice" x="136" y="152">range 0</text>
 <text class="slice" x="136" y="189">range 1</text>
 <text class="slice" x="136" y="226">⋯</text>
 <text class="slice" x="136" y="263">range N−1</text>
 <text class="meta" x="136" y="296">equal bytes per range</text>

 <!-- Range workers (stacked: one per Slurm task) -->
 <rect class="agent" x="346" y="80" width="300" height="196"/>
 <rect class="agent" x="338" y="88" width="300" height="196"/>
 <rect class="agent" x="330" y="96" width="300" height="196"/>
 <text class="h" x="480" y="128">Range workers</text>
 <text class="sub" x="480" y="151">one per Slurm task, run in any order</text>
 <text class="step" x="348" y="186">1. Stream base + experts per tensor</text>
 <text class="step" x="348" y="210">2. Apply the merge rule</text>
 <text class="step" x="348" y="234">3. Write part-*.safetensors to</text>
 <text class="file" x="366" y="252">OUT.tmp/range-i/</text>
 <text class="step" x="348" y="276">4. Mark RANGE_DONE; re-runs resume</text>

 <!-- Ranges -> workers -->
 <path class="ink" d="M 242 147.5 H 324" marker-end="url(#ah-ink)"/>
 <path class="ink" d="M 242 184.5 H 324" marker-end="url(#ah-ink)"/>
 <path class="ink" d="M 242 258.5 H 324" marker-end="url(#ah-ink)"/>

 <!-- finalize -->
 <rect class="train" x="718" y="64" width="210.8" height="88"/>
 <text class="h" x="823.4" y="97">finalize</text>
 <text class="sub" x="823.4" y="122" style="font-size:12.5px">renumber parts, write index,</text>
 <text class="sub" x="823.4" y="140" style="font-size:12.5px">copy assets, merge_info</text>

 <!-- Workers -> finalize -->
 <path class="ink" d="M 652 128 H 712" marker-end="url(#ah-ink)"/>
 <text class="lbl mid" x="682" y="118" style="font-size:11px">all done</text>

 <!-- Output checkpoint -->
 <rect class="infer" x="718" y="196" width="210.8" height="112"/>
 <text class="h" x="823.4" y="222" style="font-size:17px">OUT/</text>
 <text class="file" x="730" y="245">model-XXXXX-of-NNNNN</text>
 <text class="file" x="742" y="259">.safetensors</text>
 <text class="file" x="730" y="276">model.safetensors.index.json</text>
 <text class="file" x="730" y="292">config, tokenizer, merge_info</text>

 <!-- finalize -> OUT: atomic rename -->
 <path d="M 823.4 158 V 190" fill="none" stroke="#F44900" stroke-width="2.6" marker-end="url(#ah-orange)"/>
 <text x="836" y="179" style="font-size:12.5px; fill:#F44900">atomic rename</text>

 <!-- Footer -->
 <text class="foot" x="36" y="330">Without --num-splits, one process runs the same loop over the whole list. Output matches the direct merge bit for bit.</text>
</svg>
