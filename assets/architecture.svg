<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="964.8pt" height="612pt" viewBox="0 0 964.8 612" version="1.1" role="img" aria-labelledby="architecture-title architecture-description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
 <title id="architecture-title">RL360 agentic reinforcement learning architecture</title>
 <desc id="architecture-description">Miles sends task prompts to a pool of RL360 and Harbor agent workers. Agents use a sandboxing service for tools and verification, and make LLM calls through a pool of session servers, which record tokens and logprobs, forward requests to the SMG gateway, and return trajectories to Miles. SMG routes requests to SGLang inference engines. Megatron-LM trains on batches from Miles and synchronizes updated policy weights to SGLang. Task-specific reward functions and retrieval utilities live in the RL360 source packages.</desc>
 <defs>
  <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
   <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
  </marker>
  <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
   <path d="M0,0 L10,5 L0,10 z" fill="#F44900"/>
  </marker>
  <style type="text/css">
   text { font-family: 'DejaVu Sans', Arial, Helvetica, sans-serif; fill: #111111; }
   .title { font-size: 22px; font-weight: 700; }
   .h { font-size: 20px; font-weight: 700; text-anchor: middle; }
   .sub { font-size: 15px; text-anchor: middle; }
   .sub14 { font-size: 14px; text-anchor: middle; }
   .meta { font-size: 10.8px; text-anchor: middle; fill: #2A5160; }
   .lbl { font-size: 13px; }
   .mid { text-anchor: middle; }
   .gpu { font-size: 13px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
   .gpu-s { font-size: 10.5px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
   .eng { font-size: 11px; text-anchor: middle; fill: #2A5160; }
   .foot { font-size: 11.5px; fill: #2A5160; }
   .ink { fill: none; stroke: #111111; stroke-width: 2.2; }
   /* component groups */
   .orch  { fill: #F2F6F3; stroke: #2A5160; stroke-width: 2.6; }
   .agent { fill: #F8EFE8; stroke: #E1BFA5; stroke-width: 3; }
   .infer { fill: #E6F2E9; stroke: #111111; stroke-width: 2.2; }
   .train { fill: #FFF6F1; stroke: #F44900; stroke-width: 2.6; }
  </style>
 </defs>

